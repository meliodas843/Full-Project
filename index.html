    />
    <meta name="twitter:image" content="http://registra.mn/og-image.png" />

    <meta name="theme-color" content="#f6f7fc" id="theme-color-meta" />

    <title>Registra</title>

    <script>
      (function () {
        const STORAGE_KEY = "registra-theme";

        let theme = "light";

        try {
          const savedTheme = localStorage.getItem(STORAGE_KEY);

          if (savedTheme === "dark" || savedTheme === "light") {
            theme = savedTheme;
          } else {
            const prefersDark = window.matchMedia(
              "(prefers-color-scheme: dark)",
            ).matches;

            theme = prefersDark ? "dark" : "light";
          }
        } catch (error) {
          theme = "light";
        }

        const root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-user-theme", theme);
        root.setAttribute("data-public-theme", theme);

        document.documentElement.style.colorScheme = theme;

        function updateThemeColor(currentTheme) {
          const meta = document.getElementById("theme-color-meta");

          if (meta) {
            meta.setAttribute(
              "content",
              currentTheme === "dark" ? "#0d1124" : "#f6f7fc",
            );
          }
        }

        updateThemeColor(theme);

        window.addEventListener("registra-theme-change", function (event) {
          updateThemeColor(event.detail.theme);
        });
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
